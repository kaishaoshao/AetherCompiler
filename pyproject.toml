[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-compiler"
version = "0.17.0"
description = "Unified full-stack AI Graph & Loop-IR Compiler for LLMs and heterogeneous multi-die chiplet architectures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
torch = [
    "torch>=2.1",
]
numpy = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["compiler*", "models*", "runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "torch_golden: tests comparing AetherCompiler output against live PyTorch nn.Module / torch.fx",
    "slow: longer CPU benchmarking or fuzzing tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
