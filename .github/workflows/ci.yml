name: AetherCompiler CI

on:
  push:
    branches: [feat/learn, main]
  pull_request:
    branches: [feat/learn, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native C/C++ toolchain & pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full pytest suite
        run: pytest -v

      - name: Run legacy standalone test script runner
        run: bash scripts/run_all_tests.sh

      - name: Verify Loop-IR C99 CPU GFLOPS benchmark
        run: python benchmarks/benchmark_loop_codegen_cpu.py
